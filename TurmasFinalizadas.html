<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas Finalizadas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="o-menu">
            <div class="menu-brand"></div>
            <nav class="o-menu__section">
                <a href="index.html">Turmas em Andamento</a>
                <a href="Ocorrências.html">Ocorrências</a>
                <a href="SAEP.html">SAEP</a>
                <a href="SEEDUC.html">SEEDUC</a>
                <a href="TurmasFinalizadas.html">Turmas Finalizadas</a>
            </nav>
        </aside>

        <div class="main-area">
            <header class="o-header">
                <div class="header-title">
                    <img src="senai - Editado.png" alt="Logo Firjan SENAI" class="header-logo">
                    <h1>Acompanhamento Pedagógico</h1>
                </div>
            </header>

            <main class="o-container">
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <h2 class="o-container__turmas">Turmas Finalizadas</h2>
                            <p class="panel-subtitle">Acompanhe as turmas encerradas.</p>
                        </div>
                    </div>

                    <div class="table-scroll">
                        <table class="o-container__turmas__cadastrar__tabela">
                            <thead>
                                <tr>
                                    <th>Código da Turma</th>
                                    <th>Nome Reduzido</th>
                                    <th>Curso</th>
                                    <th>Data Início</th>
                                    <th>Data Fim</th>
                                    <th>Instrutor</th>
                                    <th>Consulta</th>
                                </tr>
                            </thead>
                            <tbody id="corpotablecadastrodeTurmas"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="modalConsultaTurmaFinalizada" class="modal-cadastro" aria-hidden="true">
        <div class="modal-content modal-content--xl consulta-finalizada">
            <div class="saep-card__header">
                <h3>Histórico da Turma (Consulta)</h3>
                <button type="button" class="btn-secondary" onclick="fecharModalConsultaTurmaFinalizada()">Fechar</button>
            </div>
            <div id="conteudoConsultaTurmaFinalizada"></div>
        </div>
    </div>

    <script src="sync-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
