<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocorrências da Turma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="o-menu">
            <div class="menu-brand"></div>
            <nav class="o-menu__section">
                <a href="index.html">Turmas em Andamento</a>
                <a href="Ocorrências.html">Ocorrências</a>
                <a href="SAEP.html">SAEP</a>
                <a href="SEEDUC.html">SEEDUC</a>
                <a href="TurmasFinalizadas.html">Turmas Finalizadas</a>
            </nav>
        </aside>

        <div class="main-area">
            <header class="o-header">
                <div class="header-title">
                    <img src="senai - Editado.png" alt="Logo Firjan SENAI" class="header-logo">
                    <h1>Acompanhamento Pedagógico</h1>
                </div>
            </header>

            <main class="o-container">
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <h2 id="tituloTurmaOcorrencia" class="o-container__turmas">Turma</h2>
                            <p id="dadosTurmaOcorrencia" class="panel-subtitle"></p>
                        </div>
                        <div class="panel-header__actions">
                            <button type="button" id="btnCadastrarAlunos" class="o-container__turmas__cadastrar">Cadastrar Alunos</button>
                            <button type="button" id="btnCadastrarOcorrenciaTurma" class="o-container__turmas__cadastrar" style="display:none;">Cadastrar Ocorrência da Turma</button>
                        </div>
                    </div>

                    <div class="seeduc-submenu occurrence-submenu">
                        <button type="button" class="seeduc-submenu__item active" data-aba-ocorrencia="alunos">Alunos</button>
                        <button type="button" class="seeduc-submenu__item" data-aba-ocorrencia="turma">Ocorrências da turma</button>
                    </div>

                    <div id="listaAlunosOcorrencia" class="alunos-lista"></div>
                    <div id="listaOcorrenciasTurma" class="alunos-lista" style="display:none;"></div>
                </section>
            </main>
        </div>
    </div>

    <div id="modalOcorrencia" class="modal-cadastro" aria-hidden="true">
        <div class="modal-content modal-content--ocorrencia">
            <form id="formOcorrencia">
                <h3 id="modalTituloOcorrencia">Adicionar ocorrência</h3>
                <input type="hidden" id="codigoTurmaOcorrencia" value="">
                <input type="hidden" id="alunoOcorrencia" value="">
                <input type="hidden" id="nomeAlunoOcorrencia" value="">
                <input type="hidden" id="ocorrenciaIdEdicao" value="">
                <div class="form-grid">
                    <label>
                        Tipo de ocorrência
                        <select id="tipoOcorrencia">
                            <option value="Pedagógica">Pedagógica</option>
                            <option value="Comportamental">Comportamental</option>
                            <option value="Frequência">Frequência</option>
                        </select>
                    </label>
                    <div class="occurrence-editor-grid saep-full-width">
                        <label class="occurrence-editor-card">
                            <span class="occurrence-editor-card__title">Texto da ocorrência</span>
                            <span class="occurrence-editor-card__subtitle">Escreva o relato objetivo do que aconteceu.</span>
                            <textarea id="descricaoOcorrencia" rows="8" placeholder="Descreva a situação..."></textarea>
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <div class="form-actions__right">
                        <button type="button" id="salvarOcorrencia" class="btn-primary">Salvar</button>
                        <button type="button" class="btn-secondary" onclick="fecharModalOcorrencia()">Cancelar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="modalOcorrenciaTurma" class="modal-cadastro" aria-hidden="true">
        <div class="modal-content">
            <form id="formOcorrenciaTurma">
                <h3 id="modalTituloOcorrenciaTurma">Cadastrar ocorrência da turma</h3>
                <input type="hidden" id="codigoTurmaOcorrenciaTurma" value="">
                <input type="hidden" id="ocorrenciaTurmaIdEdicao" value="">
                <div class="form-grid">
                    <label>
                        Data
                        <input id="dataOcorrenciaTurma" type="date" required>
                    </label>
                    <label>
                        Tipo de ocorrência
                        <input id="tipoOcorrenciaTurma" type="text" placeholder="Digite o tipo da ocorrência" required>
                    </label>
                    <label class="saep-full-width">
                        Ocorrência
                        <textarea id="descricaoOcorrenciaTurma" rows="6" placeholder="Descreva a ocorrência da turma..." required></textarea>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar</button>
                    <button type="button" class="btn-secondary" id="btnCancelarOcorrenciaTurma">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="sync-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
